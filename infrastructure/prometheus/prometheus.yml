global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: memecoin-intelligence-terminal

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: mit-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  - job_name: mit-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["worker:9100"]

  # El signer expone solo metricas agregadas: numero de solicitudes, rechazos y
  # SOL acumulado del dia. Nunca detalles de transaccion.
  - job_name: mit-signer
    metrics_path: /metrics
    static_configs:
      - targets: ["signer:9101"]
