name: Web

on:
  push:
    branches: [main]
    paths: ["apps/web/**", "package.json", ".github/workflows/web.yml"]
  pull_request:
    paths: ["apps/web/**", "package.json", ".github/workflows/web.yml"]
  workflow_dispatch:

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Next.js — lint, types, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Instalar dependencias
        run: npm ci || npm install

      - name: Type check (tsc --noEmit)
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
