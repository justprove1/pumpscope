name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # CI NUNCA tiene credenciales de proveedores ni claves de wallet (SECURITY.md 5).
  APP_ENV: ci
  ENABLE_LIVE_TRADING: "false"
  SIGNER_MODE: disabled

jobs:
  python:
    name: Python — lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check --output-format=github .

      - name: Formato (ruff format)
        run: ruff format --check .

      - name: Type check (mypy strict)
        run: mypy

      - name: Tests unitarios
        run: pytest tests/unit -v

  integration:
    name: Python — integración
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb:2.17.2-pg16
        env:
          POSTGRES_USER: mit
          POSTGRES_PASSWORD: mit
          POSTGRES_DB: mit_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mit"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://mit:mit@localhost:5432/mit_test
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Aplicar migraciones
        run: alembic upgrade head

      - name: Verificar que las migraciones son reversibles
        run: alembic downgrade base && alembic upgrade head

      - name: Tests de integración
        # -m "integration" y no "live": los tests que tocan red real nunca corren en CI.
        run: pytest -m integration tests/integration -v

  guardrails:
    name: Guardarraíles de seguridad
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: LIVE no puede venir activado por defecto
        run: |
          set -e
          grep -q '^ENABLE_LIVE_TRADING=false' .env.example
          grep -q '^SIGNER_MODE=disabled' .env.example
          echo "OK: los valores por defecto son seguros"

      - name: No hay .env versionado
        run: |
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "ERROR: .env esta versionado"; exit 1
          fi
          echo "OK: .env no esta en el repositorio"

      - name: Escaneo de secretos
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
